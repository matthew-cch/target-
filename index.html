<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weighted Randomizer App</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #1a1a1a;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 24px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #059669;
    }
    .btn-secondary:hover {
      background: #047857;
    }
    .result-box {
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .result-title {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .result-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .result-description {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.4;
      max-width: 90%;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>靠主同行</h1>

  <div class="btn-group">
    <button onclick="randomizeCategoryA()">Task</button>
    <button class="btn-secondary" onclick="randomizeNumber()">Points</button>
  </div>

  <div class="result-box">
    <div class="result-title" id="result-type">Result</div>
    <div class="result-value" id="result-display">Click a button</div>
    <div class="result-description" id="result-description">Select an option above.</div>
  </div>
</div>

<script>
  // ==========================================
  // CONFIGURATION: Set % weights, names, & descriptions here
  // ==========================================

  // 1. Category A Tasks Configuration
  const categoryAConfig = [
    { 
      name: "No Task", 
      description: "揾下一個導師！", 
      weight: 50 
    },
    { 
      name: "Task 1: 搖搖", 
      description: "每個組員要成功放和收搖搖一次", 
      weight: 5 
    },
    { 
      name: "Task 2: 平板支撐", 
      description: "全組一齊平板支撐3分鐘", 
      weight: 5 
    },
    { 
      name: "Task 3: 無影櫈", 
      description: "全組一齊無影櫈3分鐘", 
      weight: 5 
    },
    { 
      name: "Task 4: 讚美", 
      description: "講出負責導師的10個優點，不可重複", 
      weight: 5 
    },
    { 
      name: "Task 5: 閃避盤", 
      description: "要連續避開導師5次閃避盤攻擊", 
      weight: 5 
    },
    { 
      name: "Task 6: 跳繩", 
      description: "全組跳繩合共300次，每個人都要參與", 
      weight: 5 
    },
    { 
      name: "Task 7: 疊杯", 
      description: "疊杯塔，底為8隻杯", 
      weight: 5 
    },
    { 
      name: "Task 8: 乒乓球", 
      description: "用營刊將乒乓球彈150下，每個人都要參與", 
      weight: 5 
    },
    { 
      name: "Task 9: 飛營刊", 
      description: "每個人將營刊飛到5張櫈外，營刊要連在一起", 
      weight: 5 
    },
    { 
      name: "Task 10: 背著你走", 
      description: "背著你的組員在活動室走5個來回", 
      weight: 5 
    }
  ];

  // 2. Number 1–10 Configuration
  const numberConfig = [
    { name: "1", weight: 10 },
    { name: "2", weight: 10 },
    { name: "3", weight: 10 },
    { name: "4", weight: 10 },
    { name: "5", weight: 10 },
    { name: "6", weight: 15 },
    { name: "7", weight: 12 },
    { name: "8", weight: 10 },
    { name: "9", weight: 8 },
    { name: "10", weight: 5.00 }
  ];

  // ==========================================
  // RANDOMIZER LOGIC
  // ==========================================

  // Returns the entire item object based on weight
  function getWeightedRandomItem(items) {
    const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
    let randomVal = Math.random() * totalWeight;

    for (const item of items) {
      if (randomVal < item.weight) {
        return item;
      }
      randomVal -= item.weight;
    }
    return items[items.length - 1];
  }

  // Button 1 Handler: Category A
  function randomizeCategoryA() {
    const item = getWeightedRandomItem(categoryAConfig);
    document.getElementById("result-type").textContent = "Task";
    document.getElementById("result-display").textContent = item.name;
    document.getElementById("result-description").textContent = item.description;
  }

  // Button 2 Handler: Number 1–10
  function randomizeNumber() {
    const item = getWeightedRandomItem(numberConfig);
    document.getElementById("result-type").textContent = "Point";
    document.getElementById("result-display").textContent = item.name;
    document.getElementById("result-description").textContent = item.description;
  }
</script>

</body>
</html>
